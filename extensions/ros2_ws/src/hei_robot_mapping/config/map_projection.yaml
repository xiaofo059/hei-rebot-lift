# Offline RTAB-Map .db -> Nav2 .pgm + .yaml. All lengths are metres.
map_projector:
  ros__parameters:
    # Select the input with launch argument map_name:=warehouse_01 (optional .db).
    map_directory: /home/user/hei-rebot-lift/extensions/ros2_ws/src/hei_robot_mapping/map
    # Empty values use map_directory and <map_name>_2d, respectively.
    output_directory: ""
    output_name: ""

    # Inclusive height band in the SAVED MAP frame, not relative to the floor
    # or the current lidar. No automatic ground removal or height offset.
    z_min: -0.20
    z_max: 0.80
    resolution: 0.05
    padding: 0.50

    # Mark observed beam paths inside the height band free; unobserved cells
    # stay unknown. Occupied endpoints always take priority over free rays.
    # false exports occupied/unknown only, which is unsuitable for navigation
    # until free space is supplied separately.
    raytrace_free_space: true
    # Fail rather than allocate an unexpectedly huge grid (outliers/tiny cells).
    max_cells: 25000000
