# Offline RTAB-Map .db -> full 3-D .pcd + Nav2 .pgm/.yaml. All lengths are metres.
map_projector:
  ros__parameters:
    # Usually supplied by launch: db_path:=/absolute/path/warehouse_01.db
    db_path: ""
    # Legacy map_name input is resolved relative to map_directory.
    map_directory: /home/user/hei-rebot-lift/extensions/ros2_ws/src/hei_robot_mapping/map
    # Empty uses the input DB directory. Existing outputs are never overwritten.
    output_directory: ""
    # Output basename without extension; empty uses the DB stem (e.g. warehouse_01).
    # Applies to all three files: .pcd, .pgm, .yaml.
    output_name: ""

    # Inclusive height band in the SAVED MAP frame, not relative to the floor
    # or the current lidar. No automatic ground removal or height offset.
    # These limits affect ONLY PGM/YAML; PCD keeps all finite 3-D scan points
    # in the optimized map frame, with intensity (zero if unavailable).
    z_min: -0.00
    z_max: 0.80
    resolution: 0.05
    padding: 0.50

    # Mark observed beam paths inside the height band free; unobserved cells
    # stay unknown. Occupied endpoints always take priority over free rays.
    # false exports occupied/unknown only, which is unsuitable for navigation
    # until free space is supplied separately.
    raytrace_free_space: true
    # Fail rather than allocate an unexpectedly huge grid (outliers/tiny cells).
    max_cells: 25000000
